name: Documentation site

on:
  push:
    branches: ["**"]
    paths:
      - "site/**"
      - "editors/vscode/syntaxes/kora.tmLanguage.json"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "site/**"
      - "editors/vscode/syntaxes/kora.tmLanguage.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy docs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The site is a self-contained project under `site/`; everything below
    # runs from there. `next.config.mjs` reaches back out to
    # `editors/vscode/syntaxes/` for the Kora grammar, which is why that file
    # is a trigger path too.
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # `vercel pull` brings the project settings down with it, so the one
      # setting this workflow cannot survive is checkable rather than
      # folklore. The CLI already runs from `site/`; a Root Directory of
      # `site` in the dashboard would be applied on top of that and resolve
      # to `site/site`. Failing here says so, instead of deploying a 404.
      - name: Vercel Root Directory is unset
        run: |
          set -euo pipefail
          root=$(node -e "
            const s = require('./.vercel/project.json').settings || {};
            process.stdout.write(s.rootDirectory ?? '');
          ")
          if [ -n "$root" ]; then
            echo "::error::the Vercel project's Root Directory is '$root'," \
                 "but this workflow already runs from site/. Clear it in the" \
                 "project settings, or drop the working-directory here." >&2
            exit 1
          fi
          echo "Root Directory is unset, as this workflow needs"

      - name: Build Vercel output
        run: pnpm exec vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: pnpm exec vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
