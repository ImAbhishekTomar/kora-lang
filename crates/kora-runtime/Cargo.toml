[package]
name = "kora-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tree-walking interpreter and runtime for the Kora language"

[dependencies]
kora-syntax.workspace = true
kora-models.workspace = true
kora-pkg.workspace = true
kora-mcp.workspace = true
kora-python.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }

# Only for `flock`, so a durable run cannot be resumed twice at once. Windows
# gets the same guarantee from an unshared file handle and needs nothing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
kora-types.workspace = true
kora-mcp.workspace = true
kora-python.workspace = true
