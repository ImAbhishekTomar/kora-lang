# Versions are derived from commit messages, not chosen by hand.
#
# Every push to main is read as Conventional Commits: a `feat` bumps the
# minor, a `fix` the patch, a `!` or `BREAKING CHANGE` the major. The action
# keeps one open "chore: release" pull request holding the bump and the
# generated CHANGELOG. Merging that PR tags `vX.Y.Z`, and the tag is what
# `release.yml` already listens for -- so this workflow adds the deciding and
# the changelog, and changes nothing about how a release is built.
#
# Why a pull request rather than tagging on every push: a release is a
# decision, and the PR is where it gets made. The diff shows exactly which
# version and which notes are about to ship, and nothing is published until
# someone merges it.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The default GITHUB_TOKEN cannot trigger another workflow, so a
          # tag it pushes would not start `release.yml`. A PAT with `repo`
          # scope makes the tag look like a person pushed it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # release-please writes Cargo.toml but knows nothing about Cargo.lock,
      # and the lock pins the version of every workspace member. `release.yml`
      # builds with `--locked`, so a release PR whose lock still names the old
      # version fails the release it was opened for -- after the tag exists.
      - uses: actions/checkout@v7
        if: steps.release.outputs.prs_created == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        if: steps.release.outputs.prs_created == 'true'
        run: rustup update stable && rustup default stable

      - name: Sync Cargo.lock on the release branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          # Passed as raw text and parsed in the shell. `fromJSON` here is
          # evaluated while the workflow is parsed, before `if` is consulted,
          # so an empty output would make the whole file invalid on every run
          # that opens no pull request.
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          BRANCH=$(echo "$PRS" | jq -r '.[0].headBranchName')
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          # --workspace touches only the member versions; every third-party
          # dependency stays pinned exactly where it was.
          cargo update --workspace
          git config user.name "kora-release-bot"
          git config user.email "actions@github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches the release version"
          else
            git commit -m "chore: sync Cargo.lock with the release version"
            git push origin "$BRANCH"
          fi
