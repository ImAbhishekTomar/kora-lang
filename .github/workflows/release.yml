name: Release

on:
  push:
    tags: ["v*"]
  # A dry run against main, to find packaging problems before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  # A tag that does not pass CI should never become a release.
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the documentation
        run: cargo build --locked && python3 scripts/check_docs.py
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "releasing v$tag"
      - name: Internal dependency versions match the workspace version
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mismatches=$(grep -E '^kora-[a-z]+ = \{ path' Cargo.toml | grep -v "version = \"$crate\"" || true)
          if [ -n "$mismatches" ]; then
            echo "workspace.dependencies out of sync with workspace version $crate:" >&2
            echo "$mismatches" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin kora

      # A release binary that does not start is worse than no release.
      - name: The binary runs
        if: "!contains(matrix.target, 'aarch64-unknown-linux')"
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/kora"
          [ "${{ matrix.os }}" = "windows-latest" ] && binary="$binary.exe"
          "$binary" --version
          "$binary" check examples/00_basics.ko

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="kora-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/kora.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/kora" "dist/$name/"
            strip "dist/$name/kora" || true
          fi
          cp README.md LICENSE "dist/$name/" 2>/dev/null || cp README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name" > /dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          for f in *.sha256; do
            printf '%s  %s\n' "$(cat "$f")" "${f%.sha256}" >> SHA256SUMS
          done
          rm -f *.sha256
          cat SHA256SUMS

      - name: Render Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/render_formula.sh "$version" artifacts/SHA256SUMS > artifacts/kora.rb

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```

            Or download the archive for your platform below, build from source
            (`cargo install --git https://github.com/${{ github.repository }} kora-cli`),
            or drop `kora.rb` into a Homebrew tap.

            Verify a download against `SHA256SUMS`.

      - name: Push to Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git clone "https://github.com/ImAbhishekTomar/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp artifacts/kora.rb tap/Formula/kora.rb
          cd tap
          git config user.name "kora-release-bot"
          git config user.email "actions@github.com"
          git add Formula/kora.rb
          git diff --cached --quiet || git commit -m "kora ${version}"
          git remote set-url origin "https://ImAbhishekTomar:${HOMEBREW_TAP_TOKEN}@github.com/ImAbhishekTomar/homebrew-tap.git"
          git push

      - name: Skip notice
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN not set, skipped pushing the tap formula"

  publish-crates-io:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish (dependency order)
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_or_skip() {
            local crate="$1"
            echo "== $crate =="
            if output=$(cargo publish -p "$crate" --locked 2>&1); then
              echo "$output"
            else
              echo "$output"
              if echo "$output" | grep -qi "already exists\|already uploaded"; then
                echo "$crate already published at this version, continuing"
              else
                echo "$crate publish failed" >&2
                exit 1
              fi
            fi
            sleep 15
          }
          for crate in kora-syntax kora-models kora-mcp kora-python kora-types kora-runtime kora-lsp kora-dap kora-cli; do
            publish_or_skip "$crate"
          done

      - name: Skip notice
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN not set, skipped crates.io publish"

  publish-npm:
    name: Publish to npm
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Needed for --provenance: npm mints a signed attestation tying the
    # published package to this exact workflow run via OIDC.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd npm
          npm version --no-git-tag-version --allow-same-version "$version"
          npm publish --access public --provenance

      - name: Skip notice
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN not set, skipped npm publish"

  publish-vscode:
    name: Publish VS Code extension
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Set extension version to match tag
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$version"

      - name: Package
        working-directory: editors/vscode
        run: npx @vscode/vsce package -o kora-lang.vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath kora-lang.vsix

      - name: Skip notice (Marketplace)
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT not set, skipped VS Code Marketplace publish"

      # Open VSX is the marketplace used by VS Code forks (Cursor, VSCodium,
      # Windsurf, ...) that cannot use Microsoft's Marketplace terms.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish kora-lang.vsix -p "$OVSX_PAT"

      - name: Skip notice (Open VSX)
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT not set, skipped Open VSX publish"

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: editors/vscode/kora-lang.vsix
          if-no-files-found: error
