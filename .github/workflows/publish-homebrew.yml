name: Publish Homebrew formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example 0.0.2"
        required: true
        type: string

# This workflow never touches *this* repository: it checks out the tap with a
# dedicated token, downloads a published release asset over plain HTTPS, and
# pushes with that same token. So the automatic token needs no scopes at all,
# and the authority the job does carry is the one secret it was given.
permissions: {}

jobs:
  publish:
    name: Publish formula to Homebrew tap
    runs-on: ubuntu-latest
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: ImAbhishekTomar/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download release formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          curl -fsSL "https://github.com/ImAbhishekTomar/kora-lang/releases/download/v${VERSION}/kora.rb" \
            -o tap/Formula/kora.rb

      - name: Commit and push formula
        env:
          VERSION: ${{ inputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git -C tap config user.name "kora-release-bot"
          git -C tap config user.email "actions@github.com"
          git -C tap add Formula/kora.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula is already current"
          else
            git -C tap commit -m "kora ${VERSION}"
            git -C tap remote set-url origin "https://ImAbhishekTomar:${HOMEBREW_TAP_TOKEN}@github.com/ImAbhishekTomar/homebrew-tap.git"
            git -C tap push
          fi
