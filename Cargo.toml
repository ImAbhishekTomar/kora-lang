[workspace]
resolver = "2"
members = [
    "crates/kora-syntax",
    "crates/kora-types",
    "crates/kora-runtime",
    "crates/kora-models",
    "crates/kora-pkg",
    "crates/kora-lsp",
    "crates/kora-dap",
    "crates/kora-mcp",
    "crates/kora-python",
    "crates/kora-helper",
    "crates/kora-cli",
]

[workspace.package]
# Bumped by release-please from the commit history; see
# .github/workflows/release-please.yml. The annotation is what marks the line.
version = "0.2.0" # x-release-please-version
edition = "2021"
# Driven by dependencies (icu, via url via ureq), not by this code.
# The CI job pins the same version, so the two cannot drift.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ImAbhishekTomar/kora-lang"

[workspace.dependencies]
# `version` here must track workspace.package.version: crates.io requires a
# version on every dependency, path or not. The release workflow checks it, and
# release-please keeps them in step through the annotations below.
kora-syntax = { path = "crates/kora-syntax", version = "0.2.0" } # x-release-please-version
kora-types = { path = "crates/kora-types", version = "0.2.0" } # x-release-please-version
kora-runtime = { path = "crates/kora-runtime", version = "0.2.0" } # x-release-please-version
kora-models = { path = "crates/kora-models", version = "0.2.0" } # x-release-please-version
kora-pkg = { path = "crates/kora-pkg", version = "0.2.0" } # x-release-please-version
kora-lsp = { path = "crates/kora-lsp", version = "0.2.0" } # x-release-please-version
kora-dap = { path = "crates/kora-dap", version = "0.2.0" } # x-release-please-version
kora-mcp = { path = "crates/kora-mcp", version = "0.2.0" } # x-release-please-version
kora-python = { path = "crates/kora-python", version = "0.2.0" } # x-release-please-version
kora-helper = { path = "crates/kora-helper", version = "0.2.0" } # x-release-please-version
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
toml = "0.8"
# Format-preserving, for editing a human-authored kora.toml. Same version
# `toml` already pulls in, so it is not a second copy in the tree.
toml_edit = "0.22"
regex = "1"
sha2 = "0.10"
# Unpacking a package helper. Only ever reading an archive, never writing one.
tar = "0.4"
flate2 = "1"
# Text extraction only. Pure Rust, no native blob: rendering a page to pixels
# is a separate decision with a C++ library behind it.
pdf-extract = "0.12"
lopdf = "0.42"                          # pinned to what pdf-extract uses: two copies in the tree is worse than an older API
# YAML 1.2, pure Rust, and a parser rather than a serde format: `yaml` reuses
# `json`'s type coercion, so all it needs from a YAML crate is a document and
# the line/column where one failed.
yaml-rust2 = "0.12"
# Read-only, pure Rust, and namespace-aware, with DTD parsing off by default:
# `xml` needs a parser that refuses an entity rather than one configured not
# to expand it.
roxmltree = "0.21"
lsp-server = "0.7"
lsp-types = "0.95"
rusqlite = { version = "0.32", features = ["bundled"] }
