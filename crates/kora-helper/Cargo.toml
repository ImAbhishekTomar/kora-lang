[package]
name = "kora-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The package-helper boundary: a separate process a Kora package may carry work out to"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Confinement is applied with `prctl` and `setrlimit` on Linux. macOS wraps
# the helper in `sandbox-exec` instead and needs nothing here; Windows has no
# mechanism to apply.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
