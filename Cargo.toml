[workspace]
resolver = "2"
members = [
    "crates/kora-syntax",
    "crates/kora-types",
    "crates/kora-runtime",
    "crates/kora-models",
    "crates/kora-lsp",
    "crates/kora-mcp",
    "crates/kora-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/abhishektomar/kora-lang"

[workspace.dependencies]
kora-syntax = { path = "crates/kora-syntax" }
kora-types = { path = "crates/kora-types" }
kora-runtime = { path = "crates/kora-runtime" }
kora-models = { path = "crates/kora-models" }
kora-lsp = { path = "crates/kora-lsp" }
kora-mcp = { path = "crates/kora-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
toml = "0.8"
regex = "1"
lsp-server = "0.7"
lsp-types = "0.95"
rusqlite = { version = "0.32", features = ["bundled"] }
